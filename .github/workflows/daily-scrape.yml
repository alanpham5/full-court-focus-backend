name: Daily NBA scrape

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      min_games:
        description: "Require all teams to have played >= this many games (0 disables the gate)"
        default: "10"

permissions:
  contents: write

concurrency:
  group: daily-nba-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Scrape current season if ready
        working-directory: app
        run: python scripts/check_and_scrape.py --force --min-games ${{ github.event.inputs.min_games || '10' }}

      - name: Commit refreshed data
        run: |
          git config user.name "nba-scraper"
          git config user.email "nba-scraper@users.noreply.github.com"
          git add app/data/static
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh NBA data $(date -u +%Y-%m-%d)"
            git push
          fi
