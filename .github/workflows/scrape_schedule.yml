name: Refresh NBA Season Data

on:
  schedule:
    # 1st of month at 6am UTC, Nov–Dec and Jan–Apr
    - cron: "0 6 1 11,12,1,2,3,4 *"
    # 15th of month at 6am UTC, same months
    - cron: "0 6 15 11,12,1,2,3,4 *"

  workflow_dispatch:
    inputs:
      full_scrape:
        description: "Run full scrape instead of incremental?"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Run incremental scrape
        run: |
          cd app
          if [ "${{ github.event.inputs.full_scrape }}" = "true" ]; then
            python scripts/scrape_all_seasons.py
          else
            python scripts/scrape_all_seasons.py --current
          fi

      - name: Commit updated dataset
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/static/
          git diff --staged --quiet || git commit -m "chore: refresh NBA data $(date +'%Y-%m-%d')"
          git push
